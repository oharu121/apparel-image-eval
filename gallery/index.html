<!doctype html>
<meta charset="utf-8">
<title>Apparel image eval</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0 16px 48px; background: #fafafa; color: #222; }
  header { position: sticky; top: 0; background: #fafafa; padding: 12px 0; border-bottom: 1px solid #ddd; z-index: 1; }
  button { font: inherit; padding: 4px 12px; }
  button[aria-pressed=true] { background: #222; color: #fff; }
  section { margin-top: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; background: #fff; border: 1px solid #ddd; padding: 6px; }
  figure img { display: block; max-height: 360px; max-width: 280px; }
  figcaption { font-size: 12px; color: #666; margin-top: 4px; }
  .in { border-style: dashed; } .gt { border-color: #2a6fdb; }
  .scores { display: grid; grid-template-columns: auto repeat(5, 2em); gap: 2px 4px; align-items: center; font-size: 12px; }
  .done { outline: 3px solid #3a3; }
</style>
<header>
  <button id="m-cases" aria-pressed="true">Cases</button>
  <button id="m-blind" aria-pressed="false">Blind scoring</button>
  <button id="export">Export scores.csv</button>
  <span id="status"></span>
</header>
<main id="main"></main>
<script>
const D = {"cases": [{"id": "C01", "task": "T1", "item": "girl's dress with a smocked and pin-tucked yoke, long sleeves with lace cuffs, a draped sash at the hip, petal-cut tiers and lace flounces at the hem, with satin ribbon bows, all in the swatch fabric with cream lace", "material": "plain satin", "inputs": ["../data/cases/C01/inputs/line_drawing.png", "../data/cases/C01/inputs/fabric.jpg"], "truth": ["../data/cases/C01/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C01/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C01/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C01/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C02", "task": "T1", "item": "woman's two-piece day dress: bodice with a crossover draped front and long sleeves, waistband, draped overskirt and pleated underskirt, all in the swatch fabric, with a small purple silk bow at the neck", "material": "stripe", "inputs": ["../data/cases/C02/inputs/line_drawing.png", "../data/cases/C02/inputs/fabric.jpg"], "truth": ["../data/cases/C02/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C02/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C02/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C02/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}, {"src": "../results/gpt-image-2.6-sunburst/C02/A_r2_s1.png", "label": "gpt-image-2.6-sunburst / A_r2_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C02/A_r2_s2.png", "label": "gpt-image-2.6-sunburst / A_r2_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C02/A_r2_s3.png", "label": "gpt-image-2.6-sunburst / A_r2_s3"}]}, {"id": "C03", "task": "T1", "item": "child's two-piece suit: jacket and pleated skirt in the swatch fabric with black velvet ribbon lattice trims, worn over a white cotton blouse with eyelet lace collar, jabot and cuffs, and white bloomers", "material": "check / plaid", "inputs": ["../data/cases/C03/inputs/line_drawing.png", "../data/cases/C03/inputs/fabric.jpg"], "truth": ["../data/cases/C03/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C03/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C03/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C03/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}, {"src": "../results/gpt-image-2.6-sunburst/C03/A_r2_s1.png", "label": "gpt-image-2.6-sunburst / A_r2_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C03/A_r2_s2.png", "label": "gpt-image-2.6-sunburst / A_r2_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C03/A_r2_s3.png", "label": "gpt-image-2.6-sunburst / A_r2_s3"}]}, {"id": "C04", "task": "T1", "item": "short-sleeved knitted jacket with a stand collar, centre-front button closure, ribbed cuffs and hem, and gold patterned bands where drawn, in the swatch's knit", "material": "knit", "inputs": ["../data/cases/C04/inputs/line_drawing.png", "../data/cases/C04/inputs/fabric.jpg"], "truth": ["../data/cases/C04/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C04/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C04/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C04/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C05", "task": "T1", "item": "man's double-breasted frock coat with notched lapels, a fitted waist seam, a full skirt and covered buttons, in the swatch fabric", "material": "wool (dark, fine texture)", "inputs": ["../data/cases/C05/inputs/line_drawing.png", "../data/cases/C05/inputs/fabric.jpg"], "truth": ["../data/cases/C05/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C05/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C05/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C05/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C06", "task": "T2", "item": "man's double-breasted frock coat", "material": "C05 coat photo + C03 plaid swatch", "inputs": ["../data/cases/C06/inputs/base_photo.jpg", "../data/cases/C06/inputs/fabric.jpg"], "truth": [], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C06/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C06/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C06/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C07", "task": "T3", "item": "man's double-breasted frock coat", "material": "one design in 4 colourways from a museum textile sample book", "inputs": ["../data/cases/C07/inputs/line_drawing.png", "../data/cases/C07/inputs/fabric_1.jpg"], "truth": [], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C07/A_cw1_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_cw1_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw1_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_cw1_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw1_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_cw1_r1_s3"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw2_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_cw2_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw2_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_cw2_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw2_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_cw2_r1_s3"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw3_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_cw3_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw3_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_cw3_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw3_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_cw3_r1_s3"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw4_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_cw4_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw4_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_cw4_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C07/A_cw4_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_cw4_r1_s3"}]}, {"id": "C08", "task": "T4", "item": "woman's striped day dress", "material": "recolour: navy stripes to burgundy #7A1F2B, cream unchanged", "inputs": ["../data/cases/C08/inputs/base_photo.jpg"], "truth": [], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C08/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C08/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C08/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C09", "task": "T5", "item": "girl's dress with a gathered bodice, ruffled cap sleeves with red trim and a full gathered skirt", "material": "two prints placed by zone: stripe-and-sprig front panel, red floral side panels and hem border", "inputs": ["../data/cases/C09/inputs/line_drawing.png", "../data/cases/C09/inputs/fabric.jpg", "../data/cases/C09/inputs/fabric_b.jpg"], "truth": ["../data/cases/C09/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C09/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C09/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C09/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}, {"id": "C10", "task": "T6", "item": "woman's evening dress with an off-the-shoulder neckline, a deep lace bertha, a pointed fitted bodice and a long gored skirt, in the swatch fabric with cream lace", "material": "construction: large draped puff sleeves; silk velvet", "inputs": ["../data/cases/C10/inputs/line_drawing.png", "../data/cases/C10/inputs/fabric.jpg"], "truth": ["../data/cases/C10/ground_truth/photo.jpg"], "outputs": [{"src": "../results/gpt-image-2.6-sunburst/C10/A_r1_s1.png", "label": "gpt-image-2.6-sunburst / A_r1_s1"}, {"src": "../results/gpt-image-2.6-sunburst/C10/A_r1_s2.png", "label": "gpt-image-2.6-sunburst / A_r1_s2"}, {"src": "../results/gpt-image-2.6-sunburst/C10/A_r1_s3.png", "label": "gpt-image-2.6-sunburst / A_r1_s3"}]}], "axes": ["silhouette", "fabric_pattern", "pattern_scale", "colour", "texture", "construction", "usable_for_planning"]};
const KEY = "apparel-eval-scores";
let scores = {};
try { scores = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(scores)); } catch {} status(); };
const fig = (src, cap, cls = "") => `<figure class="${cls}"><a href="${src}" target="_blank"><img src="${src}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const main = document.getElementById("main");

function status() {
  const total = D.cases.reduce((n, c) => n + c.outputs.length, 0);
  const done = Object.values(scores).filter(s => D.axes.every(a => s[a])).length;
  document.getElementById("status").textContent = ` ${done}/${total} outputs fully scored`;
}

function casesView() {
  main.innerHTML = D.cases.map(c => `<section><h2>${c.id} · ${c.task} · ${c.item} · ${c.material}</h2><div class="row">
    ${c.inputs.map(s => fig(s, "input: " + s.split("/").pop(), "in")).join("")}
    ${c.outputs.map(o => fig(o.src, o.label)).join("")}
    ${c.truth.map(s => fig(s, "ground truth", "gt")).join("")}</div></section>`).join("");
}

function shuffled(xs) {
  const a = xs.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function blindView() {
  const items = shuffled(D.cases.flatMap(c => c.outputs.map(o => ({ c, o }))));
  main.innerHTML = items.map(({ c, o }, n) => {
    const s = scores[o.src] || {};
    const grid = D.axes.map(a => `<span>${a}</span>` + [1,2,3,4,5].map(v =>
      `<label><input type="radio" name="${n}-${a}" value="${v}" data-src="${o.src}" data-axis="${a}" ${s[a] == v ? "checked" : ""}></label>`).join("")).join("");
    const full = D.axes.every(a => s[a]) ? "done" : "";
    return `<section><h2>#${n + 1} · ${c.task}</h2><div class="row">
      ${c.inputs.map(x => fig(x, "input", "in")).join("")}
      <figure class="${full}" id="f${n}"><img src="${o.src}"><figcaption>output</figcaption></figure>
      ${c.truth.map(x => fig(x, "ground truth", "gt")).join("")}
      <div class="scores">${grid}</div></div></section>`;
  }).join("");
}

main.addEventListener("change", e => {
  const t = e.target;
  if (!t.dataset.src) return;
  (scores[t.dataset.src] ||= {})[t.dataset.axis] = +t.value;
  save();
  const f = t.closest("section").querySelector("figure:not(.in):not(.gt)");
  f.classList.toggle("done", D.axes.every(a => scores[t.dataset.src][a]));
});

function setMode(blind) {
  document.getElementById("m-cases").setAttribute("aria-pressed", !blind);
  document.getElementById("m-blind").setAttribute("aria-pressed", blind);
  blind ? blindView() : casesView();
}
document.getElementById("m-cases").onclick = () => setMode(false);
document.getElementById("m-blind").onclick = () => setMode(true);
document.getElementById("export").onclick = () => {
  const head = ["file", ...D.axes];
  const rows = Object.entries(scores).map(([src, s]) => [src.replace(/^\.\.\//, ""), ...D.axes.map(a => s[a] ?? "")]);
  const csv = [head, ...rows].map(r => r.join(",")).join("\n") + "\n";
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "scores.csv" });
  a.click();
};
setMode(false);
status();
</script>
